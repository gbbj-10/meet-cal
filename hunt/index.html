<style>
:root{--ink:#eaeef5;--mut:#9aa6b8;--dim:#6f7d92;--line:#232c3c;--pan:#111825;--acc:#5b9bf0}
*{box-sizing:border-box}
html,body{margin:0;background:#080c13;color:var(--ink);
 font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
 word-break:keep-all;-webkit-text-size-adjust:100%;line-height:1.65}
a{color:var(--acc)}
.bar{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
.bar .nm{font-weight:800;font-size:17px;color:var(--ink);text-decoration:none}
.bar nav{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar nav a{font-size:14px;color:var(--mut);text-decoration:none}
.bar .me{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--mut)}
.bar .me img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.wrap{max-width:820px;margin:0 auto;padding:0 18px 64px}
h1{font-size:clamp(23px,5.2vw,30px);letter-spacing:-.02em;margin:26px 0 8px}
.sub{color:var(--dim);font-size:14.5px;margin:0 0 22px}
.view{display:none}.view.on{display:block}

/* 0. 잠김 */
.lock{max-width:460px;margin:8vh auto 0;text-align:center}
.lock .seal{width:96px;height:96px;margin:0 auto 20px;border-radius:50%;
  border:1px solid #2a3a52;display:grid;place-items:center;font-size:40px;
  background:radial-gradient(circle at 50% 35%,#1b2536,#0d131d);border-color:#2a3a52}
.lock h1{margin-top:0}
.lock p{color:var(--mut);font-size:15px;margin:0 0 8px}
.lock ul{text-align:left;max-width:340px;margin:18px auto 26px;padding-left:20px;
  color:var(--mut);font-size:14.5px}
.lock li{margin-bottom:7px}
.kbtn{display:block;width:100%;max-width:340px;margin:0 auto;padding:15px;border:0;
  border-radius:12px;background:#FEE500;color:#191600;font:inherit;font-size:16.5px;
  font-weight:800;cursor:pointer}
.kbtn:active{transform:translateY(1px)}
.mini{font-size:12.5px;color:var(--dim);margin-top:14px}

/* 1. 사냥터 선택 */
.today{display:flex;align-items:center;gap:12px;background:var(--pan);
  border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:8px}
.today .gz{display:flex;gap:6px}
.today .gz b{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-size:19px;font-weight:800;color:#0a0f18;font-family:"Noto Serif KR",serif}
.today .tx{font-size:14px;color:var(--mut)}
.today .tx b{color:var(--ink)}
.mine{font-size:13.5px;color:var(--dim);margin:0 0 20px;padding-left:2px}
.mine b{color:var(--ink)}
.mine a{cursor:pointer}

.grid{display:grid;gap:12px}
.card{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;
  background:var(--pan);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;
  transition:border-color .15s,transform .15s}
.card:hover{border-color:#31405c;transform:translateY(-1px)}
.card .orb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  font-size:27px;font-weight:800;color:#0a0f18;font-family:"Noto Serif KR",serif;
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.card .t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .t b{font-size:18.5px;letter-spacing:-.01em}
.card .t span{font-size:12.5px;color:var(--dim)}
.card .one{font-size:13.5px;color:var(--mut);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;border:1px solid}
.tag.good{color:#7fe08f;border-color:#2d6b38;background:#0f2415}
.tag.mine{color:#9cc3f7;border-color:#2c4a7a;background:#141d2b}
.tag.warn{color:#f0a0a0;border-color:#5c241f;background:#1c100e}
.card.best{border-color:#2d6b38;box-shadow:0 0 0 1px #2d6b38}
.why{font-size:12.5px;color:var(--dim);margin-top:7px}

/* 2. 파티 */
.gh{display:flex;align-items:center;gap:13px;margin:22px 0 6px}
.gh .orb{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  font-size:23px;font-weight:800;color:#0a0f18;font-family:"Noto Serif KR",serif;flex:none}
.gh h1{margin:0;font-size:24px}
.gh .hj{font-size:13px;color:var(--dim)}
.back{background:0;border:0;color:var(--mut);font:inherit;font-size:14px;cursor:pointer;
  padding:14px 0 0}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:18px 0 6px}
@media(max-width:560px){.slots{grid-template-columns:repeat(2,1fr)}}
.slot{background:var(--pan);border:1px solid var(--line);border-radius:14px;
  padding:14px 10px;text-align:center;min-height:148px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px}
.slot.me{border-color:#2c4a7a;background:#111726}
.slot .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  font-size:20px;font-weight:800;color:#0a0f18;font-family:"Noto Serif KR",serif}
.slot .nm2{font-size:14px;font-weight:700;line-height:1.35;word-break:break-all}
.slot .rl{font-size:11.5px;color:var(--dim)}
.slot.empty{border-style:dashed;border-color:#2a3550}
.slot.empty .av{background:#1a2333;color:#44536e;font-size:26px}
.slot .add{background:#FEE500;color:#191600;border:0;border-radius:9px;padding:7px 11px;
  font:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.slot .pick{background:#1b2740;color:#9cc3f7;border:1px solid #2c4a7a;border-radius:9px;
  padding:7px 11px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.syn{background:var(--pan);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin:14px 0 0;font-size:14px;color:var(--mut)}
.syn b{color:var(--ink)}
.syn .bar2{height:8px;border-radius:5px;background:#1a2333;margin:9px 0 6px;overflow:hidden}
.syn .bar2 i{display:block;height:100%;border-radius:5px;background:var(--acc)}
.go{width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;
  background:var(--acc);color:#08101c;font:inherit;font-size:16.5px;font-weight:800;cursor:pointer}
.go[disabled]{background:#22304a;color:#5f7291;cursor:default}
.note{font-size:12.5px;color:var(--dim);margin-top:12px;line-height:1.7}

/* 친구 고르기 */
.mask{position:fixed;inset:0;background:rgba(4,7,12,.72);display:none;z-index:40;
  align-items:flex-end;justify-content:center;padding:0 12px max(12px,env(safe-area-inset-bottom))}
.mask.on{display:flex}
.modal{width:100%;max-width:480px;background:var(--pan);border:1px solid #27324a;
  border-radius:16px;padding:16px 18px 18px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .s{font-size:13px;color:var(--dim);margin:0 0 12px}
.flist2{list-style:none;margin:0;padding:0;max-height:46vh;overflow:auto}
.flist2 li{display:flex;align-items:center;gap:10px;padding:10px 4px;
  border-bottom:1px solid var(--line)}
.flist2 .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;color:#0a0f18;font-size:15px;font-family:"Noto Serif KR",serif;flex:none}
.flist2 b{flex:1;font-size:14.5px}
.flist2 button{background:#1b2740;color:#9cc3f7;border:1px solid #2c4a7a;border-radius:8px;
  padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.flist2 .none{color:var(--dim);font-size:14px;padding:16px 4px;border:0}
.modal .x{width:100%;margin-top:12px;background:0;border:1px solid var(--line);
  color:var(--mut);border-radius:10px;padding:11px;font:inherit;cursor:pointer}

/* 자바스크립트 없이 */
.flist{list-style:none;margin:20px auto;padding:0;max-width:560px}
.flist li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 0;border-bottom:1px solid var(--line)}
.flist i{font-style:normal;width:26px;height:26px;border-radius:50%;color:#0a0f18;
  display:grid;place-items:center;font-weight:800;flex:none}
.flist b{font-size:16px}.flist span{font-size:12.5px;color:var(--dim)}
.flist em{flex:1 0 100%;font-style:normal;font-size:13.5px;color:var(--mut)}
.demo{background:#1b1a12;border:1px solid #42360f;color:#e0c168;border-radius:10px;
  padding:10px 14px;font-size:13px;margin:16px 0 0}
</style>
</head><body>

<header class="bar">
  <a class="nm" href="/">오행 이야기</a>
  <nav>
    <a href="/">계산기</a><a href="/iljin/">일진</a><a href="/map/">지도</a>
    <a href="/ohaeng/">글</a>
    <span class="me" id="me" hidden></span>
  </nav>
</header>

<div class="wrap">

  <!-- 0. 잠김 -->
  <section class="view on" id="v-lock">
    <div class="lock">
      <div class="seal">封</div>
      <h1>사냥터는 잠겨 있습니다</h1>
      <p>카카오 계정으로 들어오시면 열립니다.</p>
      <ul>
        <li>내 캐릭터와 사냥 기록을 저장해야 합니다</li>

    </div>
  </section>

  <!-- 1. 사냥터 선택 -->
  <section class="view" id="v-pick">
    <h1>어느 사냥터로 갈까</h1>
    <p class="sub">다섯 곳 중 하나를 고르세요. 오늘의 기운과 내 사주로 유리한 곳을 표시해 뒀습니다.</p>
    <div class="today" id="today"></div>
    <p class="mine" id="mine"></p>
    <div class="grid" id="grid"></div>
    <noscript><ul class="flist"><li><i style="background:#4fb95f">木</i><b>청림곡</b><span>靑林谷</span><em>안개가 걷히지 않는 젊은 숲 · 목령(木靈)</em></li><li><i style="background:#e8483c">火</i><b>적염굴</b><span>赤炎窟</span><em>불씨가 꺼지지 않는 동굴 · 염수(炎獸)</em></li><li><i style="background:#c9a227">土</i><b>황사령</b><span>黃沙嶺</span><em>바람이 모래를 쌓아 만든 고개 · 사귀(沙鬼)</em></li><li><i style="background:#8e9bb0">金</i><b>백철갱</b><span>白鐵坑</span><em>버려진 광맥이 울리는 갱도 · 철갑충(鐵甲蟲)</em></li><li><i style="background:#3f8fe0">水</i><b>현해연</b><span>玄海淵</span><em>바닥이 보이지 않는 검은 못 · 수룡(水龍)</em></li></ul></noscript>
    <div class="demo" id="demo-note" hidden></div>
  </section>

  <!-- 2. 파티 -->
  <section class="view" id="v-party">
    <button class="back" id="btn-back">← 사냥터 다시 고르기</button>
    <div class="gh" id="gh"></div>
    <p class="sub" id="gsub"></p>
    <div class="slots" id="slots"></div>
    <div class="syn" id="syn"></div>
    <button class="go" id="btn-go" disabled>사냥 시작</button>
    <p class="note" id="note"></p>
  </section>

</div>

<div class="mask" id="mask">
  <div class="modal">
    <h3>합류한 친구</h3>
    <p class="s">내 초대 링크로 들어온 사람만 보입니다.</p>
    <ul class="flist2" id="friends"></ul>
    <button class="x" id="btn-close">닫기</button>
  </div>
</div>

<script src="/ohaeng/data/saju-calculator.js"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>

/* ===================== 설정 ===================== */
var CFG = {
  kakaoKey: '60b71fcf9ec72aad11e6f5d62358c8db',
  sbUrl:    '',
  sbKey:    ''
};
var GROUNDS = [{"el":"목","id":"cheongrim","nm":"청림곡","hj":"靑林谷","one":"안개가 걷히지 않는 젊은 숲","prey":"목령(木靈)","col":"#4fb95f","elhj":"木"},{"el":"화","id":"jeogyeom","nm":"적염굴","hj":"赤炎窟","one":"불씨가 꺼지지 않는 동굴","prey":"염수(炎獸)","col":"#e8483c","elhj":"火"},{"el":"토","id":"hwangsa","nm":"황사령","hj":"黃沙嶺","one":"바람이 모래를 쌓아 만든 고개","prey":"사귀(沙鬼)","col":"#c9a227","elhj":"土"},{"el":"금","id":"baekcheol","nm":"백철갱","hj":"白鐵坑","one":"버려진 광맥이 울리는 갱도","prey":"철갑충(鐵甲蟲)","col":"#8e9bb0","elhj":"金"},{"el":"수","id":"hyeonhae","nm":"현해연","hj":"玄海淵","one":"바닥이 보이지 않는 검은 못","prey":"수룡(水龍)","col":"#3f8fe0","elhj":"水"}];
var DSAENG = {목:'화',화:'토',토:'금',금:'수',수:'목'};   /* A가 B를 낳는다 */
var DGEUK  = {목:'토',토:'수',수:'화',화:'금',금:'목'};   /* A가 B를 이긴다 */
var DGAN='갑을병정무기경신임계', DZHI='자축인묘진사오미신유술해';
var DGANEL={갑:'목',을:'목',병:'화',정:'화',무:'토',기:'토',경:'금',신:'금',임:'수',계:'수'};
var DZHIEL={자:'수',축:'토',인:'목',묘:'목',진:'토',사:'화',오:'화',미:'토',신:'금',유:'금',술:'토',해:'수'};
var JOSA={목:{i:'이',eul:'을',eun:'은',wa:'과'},화:{i:'가',eul:'를',eun:'는',wa:'와'},
          토:{i:'가',eul:'를',eun:'는',wa:'와'},금:{i:'이',eul:'을',eun:'은',wa:'과'},
          수:{i:'가',eul:'를',eun:'는',wa:'와'}};
var J=function(el,k){ return el+((JOSA[el]||{})[k]||''); };
var $=function(id){return document.getElementById(id)};
var ev=function(n,p){ if(window.gtag) gtag('event',n,p||{}); };

/* ===================== 저장 어댑터 ===================== */
/* 키가 비어 있으면 demo 로 돈다. 채워 넣으면 그대로 supabase 가 된다. */
var MODE = (CFG.sbUrl && CFG.sbKey && CFG.sbUrl.indexOf('http')===0) ? 'supabase' : 'demo';
var sb = null;
if (MODE==='supabase' && window.supabase) sb = window.supabase.createClient(CFG.sbUrl, CFG.sbKey);

var LS = {
  get:function(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

var Store = {
  /* 로그인한 사람 */
  me:function(){
    if(MODE==='demo') return Promise.resolve(LS.get('hunt.me',null));
    return sb.auth.getUser().then(function(r){
      var u=r.data&&r.data.user; if(!u) return null;
      var m=u.user_metadata||{};
      return {id:u.id, nick:m.name||m.full_name||m.preferred_username||'이름없음',
              pic:m.avatar_url||m.picture||'', el:null};
    });
  },
  login:function(){
    if(MODE==='demo'){
      var nick = prompt('데모 모드입니다. 쓰실 이름을 넣어 주세요.','꾼기');
      if(!nick) return Promise.resolve(null);
      var me={id:'demo-'+Math.random().toString(36).slice(2,9), nick:nick, pic:'', el:null};
      LS.set('hunt.me',me); return Promise.resolve(me);
    }
    /* 2026-09-20 확인 — scopes 를 지정해도 Supabase(GoTrue)가 자기 기본값에 '덧붙인다'.
       실제 카카오로 나간 값: 'account_email profile_image profile_nickname
       profile_nickname profile_image'. account_email 을 뺄 방법이 없다.
       그래서 카카오 앱을 비즈 앱으로 전환해 account_email 권한을 여는 쪽으로 갔다.
       (개인 개발자도 본인인증 + 약관 동의로 무료 전환 가능)
       이메일은 '선택 동의'로 두고, Supabase 의 'Allow users without an email' 을 켜 둔다.
       여기서 scopes 를 다시 지정하면 중복만 늘어나므로 지정하지 않는다. */
    return sb.auth.signInWithOAuth({provider:'kakao',
      options:{redirectTo:location.origin+'/hunt/'+location.search}});
  },
  logout:function(){
    if(MODE==='demo'){ LS.set('hunt.me',null); return Promise.resolve(); }
    return sb.auth.signOut();
  },
  /* 내 프로필(오행) 저장 */
  saveEl:function(el){
    if(MODE==='demo'){ var m=LS.get('hunt.me',null); if(m){m.el=el; LS.set('hunt.me',m);} return Promise.resolve(); }
    return sb.auth.getUser().then(function(r){
      var u=r.data&&r.data.user; if(!u) return;
      return sb.from('hunt_players').upsert({user_id:u.id, dominant_element:el});
    });
  },
  /* 내 초대로 합류한 사람들 */
  friends:function(){
    if(MODE==='demo') return Promise.resolve(LS.get('hunt.friends.'+Store.myCode(ME),[]));
    return sb.auth.getUser().then(function(r){
      var u=r.data&&r.data.user; if(!u) return [];
      return sb.from('hunt_invites').select('joined_id,joined_nick,joined_element')
               .eq('host_id',u.id).then(function(q){
        return (q.data||[]).map(function(x){
          return {id:x.joined_id, nick:x.joined_nick, el:x.joined_element};
        });
      });
    });
  },
  /* 초대 링크로 들어온 사람을 host 파티에 등록 */
  join:function(hostCode, me){
    if(MODE==='demo'){
      var f=LS.get('hunt.friends.'+hostCode,[]);
      var hit=false;
      f=f.map(function(x){ if(x.id===me.id){ hit=true; return {id:me.id,nick:me.nick,el:me.el}; } return x; });
      if(!hit) f.push({id:me.id,nick:me.nick,el:me.el});
      LS.set('hunt.friends.'+hostCode,f);
      return Promise.resolve();
    }
    return sb.from('hunt_invites').upsert({host_code:hostCode, joined_id:me.id,
      joined_nick:me.nick, joined_element:me.el});
  },
  /* 파티 구성 저장/불러오기 */
  party:function(gid){
    if(MODE==='demo') return Promise.resolve(LS.get('hunt.party.'+gid,[]));
    return sb.auth.getUser().then(function(r){
      var u=r.data&&r.data.user; if(!u) return [];
      return sb.from('hunt_parties').select('members').eq('user_id',u.id)
               .eq('ground',gid).maybeSingle().then(function(q){
        return (q.data&&q.data.members)||[];
      });
    });
  },
  saveParty:function(gid, members){
    if(MODE==='demo'){ LS.set('hunt.party.'+gid,members); return Promise.resolve(); }
    return sb.auth.getUser().then(function(r){
      var u=r.data&&r.data.user; if(!u) return;
      return sb.from('hunt_parties').upsert({user_id:u.id, ground:gid, members:members});
    });
  },
  myCode:function(me){ return (me && me.id) ? String(me.id).slice(0,8) : ''; }
};

/* ===================== 오늘의 일진 ===================== */
function kstToday(){
  var t=new Date();
  var k=new Date(t.getTime()+t.getTimezoneOffset()*60000+9*3600000);
  return new Date(k.getFullYear(),k.getMonth(),k.getDate());
}
function dayPillar(d){
  var n=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1900,0,31))/86400000);
  var g=DGAN[((n%10)+10)%10], z=DZHI[((n%12)+12)%12];
  return {gan:g, zhi:z, els:[DGANEL[g],DZHIEL[z]]};
}

/* ===================== 추천 판정 ===================== */
/* 오늘의 기운 → 사냥터 : 같은 기운 +2, 기운을 실어 주면 +1, 누르면 -1 */
function todayScore(gEl, dayEls){
  var s=0;
  dayEls.forEach(function(d){
    if(d===gEl) s+=2;
    else if(DSAENG[d]===gEl) s+=1;
    else if(DGEUK[d]===gEl) s-=1;
  });
  return s;
}
/* 내 오행 → 사냥터 : 관계 한 줄 */
function mineRel(myEl, gEl){
  if(!myEl) return null;
  if(myEl===gEl)        return {k:'same', tag:'익숙한 곳',   why:'내 기운과 같은 곳이라 길을 잃지 않습니다.'};
  if(DGEUK[myEl]===gEl) return {k:'easy', tag:'내가 우세',   why:'내 '+J(myEl,'i')+' '+J(gEl,'eul')+' 누릅니다. 사냥이 수월합니다.'};
  if(DSAENG[gEl]===myEl) return {k:'gain', tag:'기운을 얻음', why:J(gEl,'i')+' 내 '+J(myEl,'eul')+' 살립니다. 오래 버팁니다.'};
  if(DGEUK[gEl]===myEl) return {k:'risk', tag:'위험',        why:J(gEl,'i')+' 내 '+J(myEl,'eul')+' 누릅니다. 혼자면 위험합니다.'};
  if(DSAENG[myEl]===gEl) return {k:'give', tag:'기운을 내줌', why:'내 '+J(myEl,'i')+' '+J(gEl,'eul')+' 살립니다. 오래 있으면 지칩니다.'};
  return {k:'flat', tag:null, why:'내 기운을 특별히 돕지도 막지도 않습니다.'};
}
/* 파티 시너지 — 상생 고리로 이어진 쌍의 수 */
function synergy(els){
  var n=0, pairs=0;
  for(var i=0;i<els.length;i++) for(var j=0;j<els.length;j++){
    if(i===j||!els[i]||!els[j]) continue;
    if(DSAENG[els[i]]===els[j]) pairs++;
  }
  var kinds={}; els.forEach(function(e){ if(e) kinds[e]=1; });
  n=Object.keys(kinds).length;
  return {pairs:pairs, kinds:n, bonus: pairs*4 + (n===5?20:0)};
}

/* ===================== 화면 ===================== */
var ME=null, MYEL=null, DAY=dayPillar(kstToday()), CUR=null, PARTY=[null,null,null,null];

function show(id){
  ['v-lock','v-pick','v-party'].forEach(function(v){ $(v).classList.toggle('on', v===id); });
  window.scrollTo({top:0,behavior:'instant'});
}

function myElement(){
  /* 허브 계산기가 저장해 둔 값이 있으면 쓰고, 없으면 물어본다 */
  var saved = LS.get('saju.dominant', null);
  if(saved) return saved;
  if(ME && ME.el) return ME.el;
  return null;
}

function askBirth(){
  var s = prompt('내 오행을 계산하려면 생년월일이 필요합니다.\n예: 1995-09-15 (시각은 몰라도 됩니다)','');
  if(!s) return;
  var m = String(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(!m){ alert('날짜를 알아보지 못했습니다. 1995-09-15 처럼 넣어 주세요.'); return; }
  if(typeof calculateSaju!=='function'){ alert('계산기를 불러오지 못했습니다.'); return; }
  var r = calculateSaju({year:+m[1], month:+m[2], day:+m[3], hour:null});
  MYEL = r.dominantElement;
  LS.set('saju.dominant', MYEL);
  Store.saveEl(MYEL);
  ev('hunt_saju_set',{element:MYEL});
  /* 초대로 들어온 사람은 오행이 정해진 뒤 다시 등록한다 — 안 그러면 '?'로 남는다 */
  var host=qs('invite');
  if(ME && host && host!==Store.myCode(ME)) Store.join(host,{id:ME.id,nick:ME.nick,el:MYEL});
  if(CUR) renderParty(); else renderPick();
}

function renderTop(){
  var d=DAY, a=d.els[0], b=d.els[1];
  $('today').innerHTML =
    '<span class="gz"><b style="background:'+colOf(a)+'">'+d.gan+'</b>'+
    '<b style="background:'+colOf(b)+'">'+d.zhi+'</b></span>'+
    '<span class="tx">오늘의 기운 <b>'+d.gan+d.zhi+'</b> · '+
    (a===b ? J(a,'i')+' 겹친 날' : J(a,'wa')+' '+b+'의 날')+'</span>';

  if(MYEL){
    $('mine').innerHTML='내 오행은 <b>'+MYEL+'</b>입니다. '+
      '<a id="reset-el">다시 계산</a>';
    var r=$('reset-el'); if(r) r.onclick=function(){ LS.set('saju.dominant',null); MYEL=null; renderPick(); };
  } else {
    $('mine').innerHTML='<a id="ask-el">생년월일을 넣으면</a> 내 사주로도 추천해 드립니다.';
    var q=$('ask-el'); if(q) q.onclick=askBirth;
  }
}

function colOf(el){ for(var i=0;i<GROUNDS.length;i++) if(GROUNDS[i].el===el) return GROUNDS[i].col; return '#8e9bb0'; }

function renderPick(){
  MYEL = myElement();
  renderTop();
  var best=-99;
  GROUNDS.forEach(function(g){ var s=todayScore(g.el,DAY.els); if(s>best) best=s; });
  var html='';
  GROUNDS.forEach(function(g){
    var ts=todayScore(g.el,DAY.els), rel=mineRel(MYEL,g.el);
    var tags='';
    if(ts>=2 && ts===best) tags+='<span class="tag good">오늘 가장 유리</span>';
    else if(ts>0)          tags+='<span class="tag good">오늘 유리</span>';
    else if(ts<0)          tags+='<span class="tag warn">오늘 불리</span>';
    if(rel && rel.tag) tags+='<span class="tag '+(rel.k==='risk'?'warn':'mine')+'">'+rel.tag+'</span>';
    var why = (ts>0 ? '오늘 '+DAY.gan+DAY.zhi+'의 기운이 '+g.el+'에 실립니다. '
                    : ts<0 ? '오늘 기운이 '+J(g.el,'eul')+' 누릅니다. ' : '')
            + (rel ? rel.why : '');
    html += '<button class="card'+((ts>=2&&ts===best)?' best':'')+'" data-g="'+g.id+'">'+
      '<span class="orb" style="background:'+g.col+'">'+g.elhj+'</span>'+
      '<span><span class="t"><b>'+g.nm+'</b><span>'+g.hj+' · '+g.prey+'</span></span>'+
      '<span class="one">'+g.one+'</span>'+
      (tags?'<span class="tags">'+tags+'</span>':'')+
      (why?'<span class="why">'+why+'</span>':'')+'</span></button>';
  });
  $('grid').innerHTML=html;
  [].forEach.call($('grid').querySelectorAll('.card'),function(b){
    b.onclick=function(){ openGround(b.dataset.g); };
  });
  if(MODE==='demo'){
    $('demo-note').hidden=false;
    $('demo-note').textContent='데모 모드입니다 — 이 브라우저 안에서만 저장되고 친구와 공유되지 않습니다. Supabase 키를 넣으면 실제로 돕니다.';
  }
  show('v-pick');
}

/* ---- 파티 화면 ---- */
function gOf(id){ for(var i=0;i<GROUNDS.length;i++) if(GROUNDS[i].id===id) return GROUNDS[i]; return null; }

function openGround(id){
  CUR = gOf(id); if(!CUR) return;
  ev('hunt_enter',{ground:CUR.nm, element:CUR.el});
  Store.party(CUR.id).then(function(m){
    PARTY = (m && m.length===4) ? m : [null,null,null,null];
    renderParty();
  });
}

function renderParty(){
  var g=CUR, ts=todayScore(g.el,DAY.els), rel=mineRel(MYEL,g.el);
  $('gh').innerHTML='<span class="orb" style="background:'+g.col+'">'+g.elhj+'</span>'+
    '<span><h1>'+g.nm+'</h1><span class="hj">'+g.hj+' · '+g.prey+'</span></span>';
  $('gsub').textContent = g.one + ' — ' +
    (ts>0?'오늘 기운이 이곳에 실립니다.':ts<0?'오늘 기운이 이곳을 누릅니다.':'오늘 기운은 이곳과 무관합니다.') +
    (rel? ' '+rel.why : '');

  var html='';
  /* 내 자리 */
  html += '<div class="slot me"><span class="av" style="background:'+(MYEL?colOf(MYEL):'#8e9bb0')+'">'+
          (MYEL?({목:'木',화:'火',토:'土',금:'金',수:'水'})[MYEL]:'?')+'</span>'+
          '<span class="nm2">'+(ME?esc(ME.nick):'나')+'</span>'+
          '<span class="rl">나 · '+(MYEL||'오행 미정')+'</span></div>';
  /* 친구 네 자리 */
  for(var i=0;i<4;i++){
    var p=PARTY[i];
    if(p){
      html += '<div class="slot"><span class="av" style="background:'+colOf(p.el)+'">'+
              (({목:'木',화:'火',토:'土',금:'金',수:'水'})[p.el]||'?')+'</span>'+
              '<span class="nm2">'+esc(p.nick)+'</span>'+
              '<span class="rl">'+(p.el||'?')+'</span>'+
              '<button class="pick" data-drop="'+i+'">빼기</button></div>';
    } else {
      html += '<div class="slot empty"><span class="av">＋</span>'+
              '<span class="rl">빈 자리</span>'+
              '<button class="add" data-invite="'+i+'">카카오톡으로 부르기</button>'+
              '<button class="pick" data-pick="'+i+'">합류한 친구</button></div>';
    }
  }
  $('slots').innerHTML=html;
  [].forEach.call($('slots').querySelectorAll('[data-invite]'),function(b){ b.onclick=invite; });
  [].forEach.call($('slots').querySelectorAll('[data-pick]'),function(b){
    b.onclick=function(){ openFriends(+b.dataset.pick); };
  });
  [].forEach.call($('slots').querySelectorAll('[data-drop]'),function(b){
    b.onclick=function(){ PARTY[+b.dataset.drop]=null; Store.saveParty(CUR.id,PARTY); renderParty(); };
  });

  var els=[MYEL].concat(PARTY.map(function(p){return p?p.el:null}));
  var sy=synergy(els), filled=1+PARTY.filter(Boolean).length;
  var SZ={1:'혼자 들어갑니다',2:'둘이 들어갑니다',3:'셋이 들어갑니다',
          4:'넷이 들어갑니다',5:'다섯이 다 모였습니다'};
  $('syn').innerHTML='<b>'+SZ[filled]+'</b> — 상생으로 이어진 쌍 '+sy.pairs+'개'+
    (sy.kinds===5?' · <b>오행 전부</b> 모였습니다':'')+
    '<span class="bar2"><i style="width:'+Math.min(100,sy.bonus)+'%"></i></span>'+
    '시너지 +'+sy.bonus+'% · 자리 '+filled+'/5'+
    (filled<5 ? ' — <span style="color:#6f7d92">더 부르면 시너지가 올라갑니다</span>' : '');
  /* 인원은 1~5 어디든 된다. 다섯을 채워야 열리는 게 아니라, 채우면 더 유리할 뿐이다. */
  $('btn-go').disabled = false;
  $('btn-go').textContent = (filled===1 ? '혼자 들어가기' : filled+'명으로 들어가기');

  var danger = (rel && rel.k==='risk' && filled<=2);
  $('note').innerHTML =
    '<b>혼자서도 들어갈 수 있습니다.</b> 인원은 1명부터 5명까지 자유롭고, '+
    '사람이 늘수록 상생 시너지가 붙습니다.<br>'+
    (danger ? '<span style="color:#f0a0a0">이 사냥터는 내 기운을 누릅니다. '+
              '혼자 들어가면 버티기 어렵습니다.</span><br>' : '')+
    '빈 자리는 <b>카카오톡으로 부르기</b>로 채웁니다. '+
    '친구가 링크로 들어오면 <b>합류한 친구</b>에 뜨고, 눌러서 자리에 앉힙니다.<br>'+
    '전투는 아직 준비 중입니다.';
  show('v-party');
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ---- 초대 ---- */
function invite(){
  if(!ME){ alert('먼저 로그인해 주세요.'); return; }
  var code = Store.myCode(ME);
  var url  = location.origin + '/hunt/?invite=' + encodeURIComponent(code) +
             '&g=' + encodeURIComponent(CUR.id);
  ev('hunt_invite',{ground:CUR.nm});
  if(window.Kakao && Kakao.isInitialized && Kakao.isInitialized() && Kakao.Share){
    try{
      Kakao.Share.sendDefault({
        objectType:'feed',
        content:{
          title: CUR.nm+'에 자리가 비어 있습니다',
          description: ME.nick+'님이 사냥터로 부릅니다. 한 자리 채워 주세요.',
          imageUrl: location.origin+'/ohaeng/img/og-ohaeng.png',
          link:{mobileWebUrl:url, webUrl:url}
        },
        buttons:[{title:'들어가기', link:{mobileWebUrl:url, webUrl:url}}]
      });
      return;
    }catch(e){}
  }
  /* 카카오가 안 되면 링크라도 손에 쥐어 준다 */
  if(navigator.share){ navigator.share({title:CUR.nm, url:url}).catch(function(){}); return; }
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){
    alert('초대 링크를 복사했습니다.\n\n'+url); }); return; }
  prompt('이 링크를 보내 주세요', url);
}

function openFriends(slot){
  Store.friends().then(function(list){
    var used={}; PARTY.forEach(function(p){ if(p) used[p.id]=1; });
    var free=list.filter(function(f){ return !used[f.id]; });
    $('friends').innerHTML = free.length ? free.map(function(f){
      return '<li><span class="av" style="background:'+colOf(f.el)+'">'+
        (({목:'木',화:'火',토:'土',금:'金',수:'水'})[f.el]||'?')+'</span>'+
        '<b>'+esc(f.nick)+'</b><button data-id="'+esc(f.id)+'">앉히기</button></li>';
    }).join('') : '<li class="none">아직 합류한 친구가 없습니다. 먼저 카카오톡으로 불러 보세요.</li>';
    [].forEach.call($('friends').querySelectorAll('button'),function(b){
      b.onclick=function(){
        var f=free.filter(function(x){return String(x.id)===b.dataset.id})[0];
        if(f){ PARTY[slot]=f; Store.saveParty(CUR.id,PARTY); }
        $('mask').classList.remove('on'); renderParty();
      };
    });
    $('mask').classList.add('on');
  });
}

/* ===================== 시작 ===================== */
function qs(k){ var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search); return m?decodeURIComponent(m[1]):''; }

function afterLogin(me){
  ME=me;
  if(!ME){ show('v-lock'); return; }
  $('me').hidden=false;
  $('me').innerHTML=(ME.pic?'<img src="'+esc(ME.pic)+'" alt="">':'')+esc(ME.nick)+
                    ' <a id="lo" style="cursor:pointer">나가기</a>';
  var lo=$('lo'); if(lo) lo.onclick=function(){ Store.logout().then(function(){ location.href='/hunt/'; }); };

  MYEL = myElement();
  if(MYEL) Store.saveEl(MYEL);

  var host=qs('invite');
  if(host && host!==Store.myCode(ME)){
    Store.join(host, {id:ME.id, nick:ME.nick, el:MYEL}).then(function(){
      ev('hunt_join',{host:host});
    });
  }
  var g=qs('g');
  /* 초대로 처음 온 사람은 오행부터 정해야 자리에 앉힐 수 있다 */
  if(host && host!==Store.myCode(ME) && !MYEL){
    if(g && gOf(g)) CUR=gOf(g);
    renderPick(); askBirth(); return;
  }
  if(g && gOf(g)){ MYEL=myElement(); renderTop(); openGround(g); }
  else renderPick();
}

(function init(){
  try{ if(CFG.kakaoKey && window.Kakao && !Kakao.isInitialized()) Kakao.init(CFG.kakaoKey); }catch(e){}
  $('btn-login').onclick=function(){
    ev('hunt_login_try',{mode:MODE});
    Promise.resolve(Store.login()).then(function(me){ if(me) afterLogin(me); });
  };
  $('btn-back').onclick=function(){ renderPick(); };
  $('btn-close').onclick=function(){ $('mask').classList.remove('on'); };
  $('mask').onclick=function(e){ if(e.target===$('mask')) $('mask').classList.remove('on'); };
  $('btn-go').onclick=function(){
    var n=1+PARTY.filter(Boolean).length;
    ev('hunt_start',{size:n, ground:CUR?CUR.nm:''});
    alert(n+'명으로 '+(CUR?CUR.nm:'사냥터')+'에 들어갑니다.\n전투는 아직 준비 중입니다. 파티는 저장해 뒀습니다.');
  };

  Promise.resolve(Store.me()).then(function(me){
    if(me) afterLogin(me);
    else {
      /* 초대 링크로 처음 온 사람에게는 왜 로그인해야 하는지 먼저 보여 준다 */
      var host=qs('invite');
      if(host){
        $('v-lock').querySelector('h1').textContent='초대를 받으셨습니다';
        $('v-lock').querySelector('p').textContent='사냥터에 한 자리가 비어 있습니다. 카카오로 들어오시면 그 자리에 앉습니다.';
      }
      show('v-lock');
    }
  }).catch(function(){ show('v-lock'); });
})();
