name: 오행 블로그 빌드

# _content/ 안의 것이 바뀔 때만 돈다.
# 이 워크플로가 만드는 index.html · map/ · ohaeng/ · sitemap.xml 은
# 경로에서 빠져 있어 무한 루프가 나지 않는다.
# love/ 는 빌드가 만들지 않는 정적 페이지라 건드리지 않는다.
on:
  push:
    branches: [main]
    paths:
      - '_content/**'
      - '.github/workflows/build-ohaeng.yml'
  workflow_dispatch:      # 수동 실행 버튼
  schedule:
    # /iljin/ 은 오늘 날짜가 박혀 나가므로 날이 바뀌면 다시 빌드해야 한다.
    # 깃허브 크론은 UTC 다. 15:10 UTC = 한국 00:10 (다음 날).
    - cron: '10 15 * * *'

permissions:
  contents: write         # 빌드 결과를 다시 커밋해야 한다

concurrency:              # 연달아 올리면 마지막 것만 배포
  group: build-ohaeng
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install --quiet markdown pyyaml

      - name: 빌드
        run: python _content/build/deploy.py

      - name: 결과 반영
        run: |
          rm -rf ohaeng
          cp -r _content/deploy/ohaeng ohaeng
          cp _content/deploy/index.html  index.html     # 사이트 첫 화면(허브)
          rm -rf map
          cp -r _content/deploy/map map                  # 환영 화면과 지도
          rm -rf iljin
          cp -r _content/deploy/iljin iljin              # 오늘의 일진 (매일 갱신)
          rm -rf hunt
          cp -r _content/deploy/hunt hunt                # 사냥터 (카카오 로그인 뒤 열림)
          rm -rf gunghap
          cp -r _content/deploy/gunghap gunghap          # 궁합소 (카카오 로그인 + 초대 링크, 2026-09-24)
          cp _content/deploy/sitemap.xml sitemap.xml

      - name: 확인 — 글이 실제로 생겼나
        run: |
          test -f ohaeng/index.html || { echo "::error::ohaeng/index.html 이 없습니다"; exit 1; }
          test -f index.html        || { echo "::error::루트 index.html 이 없습니다"; exit 1; }
          test -f map/index.html    || { echo "::error::map/index.html 이 없습니다"; exit 1; }
          test -f iljin/index.html  || { echo "::error::iljin/index.html 이 없습니다"; exit 1; }
          test -f hunt/index.html   || { echo "::error::hunt/index.html 이 없습니다"; exit 1; }
          test -f gunghap/index.html || { echo "::error::gunghap/index.html 이 없습니다"; exit 1; }
          grep -q 'noindex' gunghap/index.html \
            || { echo "::error::궁합소에 noindex 가 빠졌습니다"; exit 1; }
          grep -q 'noindex' hunt/index.html \
            || { echo "::error::사냥터에 noindex 가 빠졌습니다"; exit 1; }
          h=$(grep -o '"id":"' hunt/index.html | wc -l)
          test "$h" -ge 5 || { echo "::error::사냥터가 모자랍니다 ($h)"; exit 1; }
          echo "사냥터: $h 곳"
          # 일진 페이지에 오늘 날짜가 실제로 박혀 있는지 (한국 시간 기준)
          kd=$(TZ=Asia/Seoul date '+%Y년 %-m월 %-d일')
          grep -q "$kd" iljin/index.html \
            || { echo "::error::일진 페이지의 날짜가 오늘($kd)이 아닙니다"; exit 1; }
          echo "일진 날짜: $kd"
          # 지도는 2열 버튼이다(2026-09-24). 건물 버튼 여섯 개(궁합소 포함)가 다 있어야 한다.
          # 버튼이 그냥 링크라서 자바스크립트가 못 돌 때의 대체 목록은 따로 없다.
          t=$(grep -o 'class="tile' map/index.html | wc -l)
          echo "지도 버튼: $t 개"
          test "$t" -ge 6 || { echo "::error::지도 버튼이 모자랍니다 ($t)"; exit 1; }
          grep -q 'href="/gunghap/"' map/index.html || { echo "::error::지도에 궁합소 버튼이 없습니다"; exit 1; }
          n=$(ls ohaeng/*.html | wc -l)
          echo "생성된 HTML: $n 개"
          test "$n" -ge 2 || { echo "::error::글이 너무 적습니다"; exit 1; }
          # 허브에서 계산기가 빠지면 첫 화면이 빈 껍데기가 된다
          grep -q 'saju-calculator.js' index.html \
            || { echo "::error::허브에 사주 계산기가 없습니다"; exit 1; }
          grep -q 'class="card"' index.html \
            || echo "::warning::허브에 글 카드가 하나도 없습니다"
          test -f love/index.html || echo "::warning::love/index.html 이 없습니다 — 허브의 링크가 404 가 됩니다"
          grep -q 'G-' ohaeng/index.html || echo "::warning::GA4 태그가 안 보입니다"

      # 페이지마다 '나가는 곳' 을 세어, 깨진 링크와 막다른 길을 잡는다.
      # 2026-09-20 에 넣었다. 그 전까지 글 목록 페이지는 사이트 바깥으로 나가는
      # 링크가 0개인 채로 몇 주를 서 있었는데, 눈으로는 아무도 못 봤다.
      - name: 확인 — 링크 전수 검사
        run: python _content/build/link_check.py --root .

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ohaeng map iljin hunt gunghap index.html sitemap.xml
          if git diff --staged --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "자동 빌드 — 일진 갱신 포함 [skip ci]"
            git push
          fi
