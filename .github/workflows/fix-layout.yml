name: 한 번만 — 폴더 제자리 찾기

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 지금 무엇이 어디 있나
        run: |
          echo "── 루트"; ls -la
          echo "── meetcal_사이트"; ls -la "meetcal_사이트" 2>/dev/null || echo "(없음)"

      - name: 옮기기
        run: |
          set -e
          D="meetcal_사이트"
          if [ ! -d "$D" ]; then
            echo "::notice::$D 폴더가 없습니다 — 이미 정리됐거나 폴더 이름이 다릅니다"
            exit 0
          fi
          shopt -s dotglob
          cp -r "$D"/. .
          rm -rf "$D"
          echo "── 옮긴 뒤 루트"; ls -la

      - name: 확인
        run: |
          test -f _content/build/deploy.py || { echo "::error::_content/build/deploy.py 가 아직 없습니다"; exit 1; }
          test -f _content/build/map.py    || { echo "::error::_content/build/map.py 가 없습니다"; exit 1; }
          test -f _content/build/iljin.py  || { echo "::error::_content/build/iljin.py 가 없습니다"; exit 1; }
          test -d _content/draft           || { echo "::error::_content/draft 가 없습니다"; exit 1; }
          test -f love/index.html          || { echo "::error::love/index.html 이 없습니다"; exit 1; }
          test -f _config.yml              || echo "::warning::_config.yml 이 없습니다"
          grep -q 'saju-calculator.js' index.html \
            || { echo "::error::루트 index.html 이 아직 옛 계산기입니다"; exit 1; }
          echo "제자리 OK"

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "폴더 제자리 — meetcal_사이트/ 안의 것을 저장소 루트로 [skip ci]"
            git push
          fi
